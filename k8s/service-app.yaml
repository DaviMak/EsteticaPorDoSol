#Junta os 2 pods do aplicativo sob um único endereço e abre o acesso para o seu navegador e depois distribui a carga entre os pods do aplicativo

apiVersion: v1
kind: Service
metadata:
  name: estetica-app-service
spec:
  type: LoadBalancer # Cria o IP de acesso externo no Minikube
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: estetica-app
