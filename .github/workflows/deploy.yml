name: Deploy

# Equivalente automatizado do deploy.ps1 -SomenteApp: nao provisiona
# infraestrutura, apenas constroi a imagem e publica uma revisao nova.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois merges seguidos nao podem publicar em paralelo: a revisao mais lenta
# sobrescreveria a mais nova. Nao cancelamos o deploy em andamento porque
# aborta-lo no meio deixa o servico em estado indefinido.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: estetica-por-do-sol
  REGION: southamerica-east1
  SERVICE_NAME: estetica
  SQL_INSTANCE: estetica-mysql
  SECRET_NAME: estetica-db-connection
  REPO_NAME: apps
  IMAGE_NAME: estetica

jobs:
  deploy:
    name: Build e deploy no Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # o token OIDC trocado por credenciais do GCP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Instalar o gcloud
        uses: google-github-actions/setup-gcloud@v2

      # A aplicacao aplica migrations no startup e nao sobe sem banco. Como o
      # Cloud SQL costuma ficar desligado para nao gerar custo, o deploy religa
      # a instancia e espera ela estabilizar.
      - name: Ligar o Cloud SQL se estiver parado
        run: |
          estado=$(gcloud sql instances describe "$SQL_INSTANCE" \
            --project="$PROJECT_ID" --format='value(state)')
          echo "estado atual: $estado"

          if [ "$estado" != "RUNNABLE" ]; then
            gcloud sql instances patch "$SQL_INSTANCE" \
              --activation-policy=ALWAYS --project="$PROJECT_ID" --quiet

            for tentativa in $(seq 1 60); do
              sleep 10
              estado=$(gcloud sql instances describe "$SQL_INSTANCE" \
                --project="$PROJECT_ID" --format='value(state)')
              echo "tentativa $tentativa: $estado"
              [ "$estado" = "RUNNABLE" ] && break
            done
          fi

          if [ "$estado" != "RUNNABLE" ]; then
            echo "::error::a instancia nao ficou RUNNABLE em 10 minutos"
            exit 1
          fi

      # A imagem leva o SHA do commit: da para abrir uma revisao no Cloud Run e
      # saber exatamente qual codigo esta rodando.
      - name: Construir a imagem no Cloud Build
        run: |
          IMAGEM="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }}"
          echo "IMAGEM=$IMAGEM" >> "$GITHUB_ENV"
          gcloud builds submit --config=cloudbuild.yaml \
            --substitutions=_IMAGEM="$IMAGEM" --project="$PROJECT_ID"

      - name: Publicar no Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGEM" \
            --region="$REGION" \
            --platform=managed \
            --port=8080 \
            --allow-unauthenticated \
            --add-cloudsql-instances="$PROJECT_ID:$REGION:$SQL_INSTANCE" \
            --set-secrets="ConnectionStrings__DefaultConnection=$SECRET_NAME:latest" \
            --project="$PROJECT_ID"

      # A revisao subir nao prova que a aplicacao funciona: uma migration com
      # erro so aparece na primeira requisicao. O timeout e alto porque esse
      # primeiro acesso sobe o container do zero.
      - name: Validar o deploy
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')
          echo "URL: $URL"

          codigo=0
          for tentativa in 1 2 3; do
            echo "tentativa $tentativa de 3"
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 90 "$URL") || codigo=000
            echo "HTTP $codigo"
            if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 400 ]; then break; fi
            sleep 10
          done

          {
            echo "### Deploy concluido"
            echo ""
            echo "- URL: $URL"
            echo "- Imagem: \`$IMAGEM\`"
            echo "- Commit: ${{ github.sha }}"
            echo "- Resposta HTTP: $codigo"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 400 ]; then
            echo "::error::a revisao subiu mas a aplicacao respondeu HTTP $codigo"
            echo "logs: gcloud run services logs read $SERVICE_NAME --region=$REGION --project=$PROJECT_ID --limit=50"
            exit 1
          fi
