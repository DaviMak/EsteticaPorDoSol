name: CI

on:
  pull_request:
    branches: [main, dev, back-end]
  push:
    branches: [dev, back-end]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: Build e artefatos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Aponta o .csproj: com o .sln na raiz, o --output dispara NETSDK1194.
      - name: Gerar os artefatos
        run: dotnet publish back-end/EsteticaPorDoSol.csproj --no-build --configuration Release --output publicado

      - name: Publicar os artefatos
        uses: actions/upload-artifact@v4
        with:
          name: aplicacao-${{ github.sha }}
          path: publicado/
          retention-days: 14

      # O deploy constroi a imagem a partir deste mesmo Dockerfile: se ele
      # quebrar, e melhor descobrir no PR do que depois do merge.
      - name: Validar o Dockerfile
        run: docker build --file back-end/Dockerfile --tag estetica:${{ github.sha }} .

  qualidade:
    name: Qualidade de codigo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar o .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Verificar a formatacao
        run: dotnet format back-end/EsteticaPorDoSol.csproj --verify-no-changes --verbosity minimal

      # Informativo: os avisos de nulidade e de API obsoleta ficam registrados
      # no resumo da execucao, mas nao travam o merge. Quem trava e o CodeQL.
      - name: Avisos do compilador
        run: |
          dotnet build --no-restore --configuration Release 2>&1 | tee build.log
          avisos=$( { grep "warning " build.log || true; } | sort -u | wc -l)
          echo "- Avisos do compilador: $avisos" >> "$GITHUB_STEP_SUMMARY"
          grep "warning " build.log | sort -u >> "$GITHUB_STEP_SUMMARY" || true

      # 'dotnet list package --vulnerable' sai com codigo 0 mesmo achando
      # vulnerabilidade, entao a falha e decidida pela saida do comando.
      - name: Verificar dependencias vulneraveis
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulneraveis.txt
          if grep -q "tem os seguintes pacotes vulneráveis\|has the following vulnerable packages" vulneraveis.txt; then
            echo "::error::dependencias vulneraveis encontradas"
            exit 1
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inicializar o CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none

      - name: Analisar
        uses: github/codeql-action/analyze@v3
